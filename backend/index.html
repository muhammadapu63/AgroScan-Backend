<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroScan AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f0f7f0; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 18px; width: 100%; margin-top: 20px; font-weight: bold;}
        img { width: 100%; border-radius: 15px; margin-top: 20px; border: 2px solid #2e7d32; display: none; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #2e7d32;">🌿 AgroScan AI</h1>
        <p>আপনার ফসলের ছবি তুলুন এবং রোগ শনাক্ত করুন</p>
        
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button class="btn" onclick="document.getElementById('imageInput').click()">📷 ছবি তুলুন / সিলেক্ট করুন</button>
        
        <img id="preview" src="">
        
        <button class="btn" id="checkBtn" onclick="checkDisease()" style="background-color: #1b5e20;">🔎 রোগ শনাক্ত করুন</button>
        
        <div id="result-box">
            <h3 id="res-text"></h3>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        imageInput.onchange = () => {
            const [file] = imageInput.files;
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        }

        async function checkDisease() {
            const file = imageInput.files[0];
            if (!file) return alert("দয়া করে আগে একটি ছবি তুলুন!");

            document.getElementById('res-text').innerText = "অ্যানালাইসিস করা হচ্ছে...";
            document.getElementById('result-box').style.display = "block";
            document.getElementById('result-box').style.backgroundColor = "#eee";

            const formData = new FormData();
            formData.append('image', file);

            try {
                // আপনার পিসির বর্তমান আইপি এখানে দিন
                const response = await fetch('http://192.168.0.113:5000/api/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const box = document.getElementById('result-box');
                const resText = document.getElementById('res-text');
                
                resText.innerHTML = "ফলাফল: <br><span style='font-size: 24px; color: red;'>" + data.result + "</span>";
                box.style.backgroundColor = "#e8f5e9";
                box.style.border = "2px solid green";
            } catch (error) {
                alert("সার্ভার কানেক্ট করা যায়নি।");
            }
        }
    </script>
</body>
</html>
